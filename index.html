<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monday Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .status-pill { transition: all 0.2s ease; cursor: pointer; }
    .status-pill:hover { filter: brightness(0.95); transform: translateY(-1px); }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">M</div>
        <span class="font-bold text-lg text-white tracking-wide">Monday OS</span>
      </div>
    </div>
    
    <div class="p-4">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Seus Quadros</div>
      <div id="boards-list" class="space-y-1">
        <!-- Renderizado via JS -->
      </div>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="flex-1 flex flex-col min-w-0 bg-white">
    <!-- Topbar -->
    <header class="h-16 border-b border-gray-200 px-6 flex items-center justify-between bg-white">
      <div class="flex items-center space-x-4">
        <h1 id="board-title" class="text-2xl font-bold text-gray-900">A carregar...</h1>
      </div>
      <div class="text-xs text-green-600 bg-green-50 border border-green-200 px-3 py-1 rounded-full font-medium flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        Conectado ao SQLite (8080)
      </div>
    </header>

    <!-- Área de Conteúdo / Tabela -->
    <div class="flex-1 overflow-auto p-6">
      <div id="groups-container" class="space-y-8 max-w-6xl">
        <!-- Grupos e tarefas carregados dinamicamente -->
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://mondayteste.onrender.com";
    let currentBoardData = null;

    // Carregar dados da API
    async function loadBoard() {
      try {
        const response = await fetch(`${API_URL}/boards`);
        const boards = await response.json();
        
        if (boards.length > 0) {
          currentBoardData = boards[0];
          document.getElementById('board-title').textContent = currentBoardData.title;
          
          // Renderizar lista de quadros na sidebar
          const boardsListEl = document.getElementById('boards-list');
          boardsListEl.innerHTML = boards.map(b => `
            <button class="w-full text-left px-3 py-2 rounded-md bg-slate-800 text-white text-sm font-medium flex items-center space-x-2">
              <i class="fa-solid fa-table-columns text-indigo-400"></i>
              <span>${b.title}</span>
            </button>
          `).join('');

          renderGroups();
        }
      } catch (error) {
        console.error("Erro ao carregar do servidor:", error);
      }
    }

    // Renderizar grupos e tarefas estilo Monday
    function renderGroups() {
      const container = document.getElementById('groups-container');
      container.innerHTML = '';

      if (!currentBoardData || !currentBoardData.groups) return;

      currentBoardData.groups.forEach(group => {
        const groupEl = document.createElement('div');
        groupEl.className = 'bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden';

        const colorClasses = {
          blue: 'text-blue-600 border-blue-500 bg-blue-50',
          purple: 'text-purple-600 border-purple-500 bg-purple-50'
        }[group.color] || 'text-blue-600 border-blue-500 bg-blue-50';

        let tasksRowsHtml = group.tasks.map(task => `
          <tr class="border-b border-gray-100 hover:bg-slate-50 transition-colors">
            <td class="py-2.5 px-4 font-medium text-gray-800">${task.title}</td>
            <td class="py-2.5 px-4 w-40">
              <span onclick="toggleStatus('${task.id}', '${task.status}')" class="status-pill inline-block w-full text-center py-1 rounded text-xs font-semibold text-white ${getStatusBg(task.status)}">
                ${task.status}
              </span>
            </td>
            <td class="py-2.5 px-4 w-32">
              <span class="inline-block w-full text-center py-1 rounded text-xs font-medium ${getPriorityBg(task.priority)}">
                ${task.priority}
              </span>
            </td>
            <td class="py-2.5 px-4 w-32 text-center text-sm text-gray-500">
              <button onclick="deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 transition-colors">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `).join('');

        groupEl.innerHTML = `
          <div class="px-4 py-3 ${colorClasses} border-l-4 font-bold text-lg flex justify-between items-center">
            <span>${group.title}</span>
          </div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="text-xs uppercase text-gray-400 border-b border-gray-200 bg-gray-50">
                <th class="py-2 px-4 font-semibold">Tarefa</th>
                <th class="py-2 px-4 font-semibold text-center">Status</th>
                <th class="py-2 px-4 font-semibold text-center">Prioridade</th>
                <th class="py-2 px-4 font-semibold text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              ${tasksRowsHtml}
            </tbody>
          </table>
          <div class="p-3 bg-gray-50 border-t border-gray-100">
            <form onsubmit="addTask(event, '${group.id}')" class="flex gap-2">
              <input type="text" placeholder="+ Adicionar tarefa" required class="flex-1 px-3 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:border-indigo-500">
              <button type="submit" class="px-4 py-1.5 bg-indigo-600 text-white rounded text-sm font-medium hover:bg-indigo-700">Adicionar</button>
            </form>
          </div>
        `;
        container.appendChild(groupEl);
      });
    }

    function getStatusBg(status) {
      switch (status) {
        case 'Feito': return 'bg-emerald-500';
        case 'Em Andamento': return 'bg-amber-500';
        default: return 'bg-gray-400';
      }
    }

    function getPriorityBg(priority) {
      switch (priority) {
        case 'Alta': return 'bg-red-100 text-red-700';
        case 'Média': return 'bg-amber-100 text-amber-700';
        default: return 'bg-slate-100 text-slate-700';
      }
    }

    // Criar nova tarefa
    async function addTask(event, groupId) {
      event.preventDefault();
      const input = event.target.querySelector('input');
      const title = input.value.trim();

      if (!title) return;

      await fetch(`${API_URL}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group_id: groupId, title: title })
      });

      input.value = '';
      loadBoard();
    }

    // Alternar status
    async function toggleStatus(taskId, currentStatus) {
      const nextStatus = currentStatus === 'Não Iniciado' ? 'Em Andamento' : (currentStatus === 'Em Andamento' ? 'Feito' : 'Não Iniciado');
      await fetch(`${API_URL}/tasks/${taskId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: nextStatus })
      });
      loadBoard();
    }

    // Eliminar tarefa
    async function deleteTask(taskId) {
      await fetch(`${API_URL}/tasks/${taskId}`, { method: 'DELETE' });
      loadBoard();
    }

    // Inicializar
    loadBoard();
  </script>
</body>
</html>
